name: Temporary Getgems market scan

on:
  push:
    branches:
      - tmp/getgems-market-scan-20260816

permissions:
  contents: write

jobs:
  scan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install parser dependencies
        run: npm install --no-save @ton/core @ton/ton @ton/crypto tweetnacl
      - name: Probe Getgems AI token transport
        run: node tools/getgems-auth-probe.mjs
