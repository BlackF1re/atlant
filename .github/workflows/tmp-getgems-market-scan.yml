name: Temporary Getgems market scan

on:
  push:
    branches:
      - tmp/getgems-market-scan-20260816

permissions:
  contents: write

jobs:
  scan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install parser dependencies
        run: npm install --no-save @ton/core @ton/ton @ton/crypto tweetnacl

      - name: Scan Getgems offers and floors
        run: node tools/getgems-offer-scan.mjs

      - name: Commit scan result to temporary branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market-scan-result.json
          git commit -m 'chore: update temporary Getgems market scan result' || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
