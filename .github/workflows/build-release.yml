name: Build & Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this AtlANTian build
        required: true
        type: boolean
        default: false
      origin:
        description: Internal dispatch origin
        required: false
        type: string
        default: manual
  push:
    branches: [main]
    paths:
      # Workflow-only maintenance is intentionally excluded: changing this file
      # must not spend a full release build. Source/build inputs still trigger it.
      - 'board/**'
      - 'config/**'
      - 'debian-*.sha256'
      - 'fpga/**'
      - 'kernel-overlay/**'
      - 'scripts/**'
      - 'systemd/**'

permissions:
  contents: read

# Build/test and publication are separate jobs. A successful build stores a
# SHA-specific verified artifact before publication starts, so a publication
# failure cannot discard expensive caches or force a rebuild on retry.
concurrency:
  group: atlantian-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    env:
      ATLANTIAN_GITHUB_REPO: ${{ github.repository }}
    outputs:
      publish_requested: ${{ steps.plan.outputs.publish_requested }}
      build_required: ${{ steps.plan.outputs.build_required }}
      already_published: ${{ steps.plan.outputs.already_published }}
      reuse_run_id: ${{ steps.plan.outputs.reuse_run_id }}
      artifact_name: ${{ steps.plan.outputs.artifact_name }}
      version: ${{ steps.auto_version.outputs.version }}
      patch: ${{ steps.auto_version.outputs.patch }}
      prerelease: ${{ steps.auto_version.outputs.prerelease }}
    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve automatic release version
        id: auto_version
        shell: bash
        run: bash scripts/resolve-release-version.sh "$GITHUB_SHA"

      - name: Find reusable verified build
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_REQUESTED: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.origin == 'debian-watch')) }}
        run: |
          set -euo pipefail
          . config/release.env

          artifact_name="atlantian-verified-${GITHUB_SHA}"
          build_required=true
          already_published=false
          reuse_run_id=""

          if [[ "$PUBLISH_REQUESTED" == true ]]; then
            release_tag="v$ATLANTIAN_VERSION"
            tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$release_tag" --jq .sha 2>/dev/null) || tag_commit=""

            if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
              && [[ "$tag_commit" = "$GITHUB_SHA" ]]; then
              already_published=true
              build_required=false
              echo "Release $release_tag already exists for this exact source; no build or upload is necessary."
            else
              reuse_run_id=$(
                gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts" \
                  -f name="$artifact_name" \
                  -f per_page=100 \
                  --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_sha == env.GITHUB_SHA)] | sort_by(.created_at) | last | .workflow_run.id // empty'
              )
              if [[ -n "$reuse_run_id" ]]; then
                build_required=false
                echo "Reusing verified artifact $artifact_name from workflow run $reuse_run_id."
              else
                echo "No reusable verified artifact exists for $GITHUB_SHA; a full build is required."
              fi
            fi
          fi

          {
            echo "publish_requested=$PUBLISH_REQUESTED"
            echo "build_required=$build_required"
            echo "already_published=$already_published"
            echo "reuse_run_id=$reuse_run_id"
            echo "artifact_name=$artifact_name"
          } >> "$GITHUB_OUTPUT"

          {
            echo '## AtlANTian release plan'
            echo
            echo '| Item | Value |'
            echo '|---|---|'
            echo "| Version | $ATLANTIAN_VERSION |"
            echo "| Publish requested | $PUBLISH_REQUESTED |"
            echo "| Build required | $build_required |"
            echo "| Already published | $already_published |"
            echo "| Reusable workflow run | ${reuse_run_id:-none} |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and verify
    needs: plan
    if: needs.plan.outputs.build_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    env:
      ATLANTIAN_GITHUB_REPO: ${{ github.repository }}
      ATLANTIAN_PATCH_OVERRIDE: ${{ needs.plan.outputs.patch }}
      ATLANTIAN_PRERELEASE_OVERRIDE: ${{ needs.plan.outputs.prerelease }}
    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare release identity
        id: identity
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          export ATLANTIAN_SOURCE_REVISION
          ATLANTIAN_SOURCE_REVISION=$(git rev-parse --short=12 "$GITHUB_SHA")
          . config/release.env
          . config/u-boot.env
          test "$ATLANTIAN_VERSION" = "$EXPECTED_VERSION"
          {
            echo "ATLANTIAN_SOURCE_REVISION=$ATLANTIAN_SOURCE_REVISION"
            echo "ATLANTIAN_SOURCE_ID=$ATLANTIAN_SOURCE_ID"
            echo "ATLANTIAN_VERSION=$ATLANTIAN_VERSION"
            echo "ATLANTIAN_DEB_VERSION=$ATLANTIAN_DEB_VERSION"
            echo "ATLANTIAN_PRERELEASE=$ATLANTIAN_PRERELEASE"
            echo "ATLANTIAN_RELEASE_ID=$ATLANTIAN_RELEASE_ID"
            echo "ATLANTIAN_IMAGE_NAME=$ATLANTIAN_IMAGE_NAME"
            echo "RELEASE_TAG=v$ATLANTIAN_VERSION"
          } >> "$GITHUB_ENV"
          {
            echo "debian_codename=$DEBIAN_CODENAME"
            echo "kernel_commit=$ATLANTIAN_KERNEL_COMMIT"
            echo "kernel_localversion=$ATLANTIAN_KERNEL_LOCALVERSION"
            echo "uboot_commit=$ATLANTIAN_UBOOT_COMMIT"
          } >> "$GITHUB_OUTPUT"

      - name: Validate source contracts
        id: preflight
        run: |
          set -euo pipefail
          bash scripts/test-build-orchestration.sh
          bash scripts/test-runtime-policy.sh
          bash scripts/test-source-contracts.sh
          bash scripts/test-update-leds.sh
          bash scripts/test-release-metrics.sh

      - name: Validate release inputs
        id: inputs
        run: bash scripts/validate-release-inputs.sh

      - name: Install build dependencies
        id: dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap qemu-user-static binfmt-support \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
            bc bison flex libssl-dev libncurses-dev device-tree-compiler \
            u-boot-tools kmod cpio rsync pigz xz-utils zstd e2fsprogs dosfstools parted \
            mtd-utils squashfs-tools jq \
            libelf-dev libdw-dev git curl ca-certificates sudo \
            python3 python3-dev python3-setuptools python3-pyelftools swig

      - name: Compute toolchain fingerprint
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          fingerprint=$({
            arm-linux-gnueabihf-gcc --version
            arm-linux-gnueabihf-ld --version
          } | sha256sum | awk '{print $1}')
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Cache Debian packages
        id: debootstrap_cache
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/debootstrap
          key: debootstrap-${{ steps.identity.outputs.debian_codename }}-${{ hashFiles('config/debian-snapshot.env') }}
          restore-keys: |
            debootstrap-${{ steps.identity.outputs.debian_codename }}-

      - name: Cache Linux build tree
        id: kernel_cache
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: out/linux-src
          key: linux-build-${{ steps.identity.outputs.kernel_commit }}-${{ steps.identity.outputs.kernel_localversion }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('board/zynq-bitmain-antminer-s9.dts', 'config/kernel.fragment', 'config/kernel-prune.fragment', 'kernel-overlay/**', 'scripts/build-kernel.sh') }}

      - name: Cache U-Boot source
        id: uboot_cache
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: out/u-boot-src
          key: uboot-source-${{ steps.identity.outputs.uboot_commit }}

      - name: Prepare Linux source
        id: kernel_source
        run: |
          set -euo pipefail
          mkdir -p out
          . config/release.env
          current=$(git -C out/linux-src rev-parse HEAD 2>/dev/null || true)
          if [[ "$current" = "$ATLANTIAN_KERNEL_COMMIT" ]]; then
            git -C out/linux-src reset --quiet --hard "$ATLANTIAN_KERNEL_COMMIT"
            echo "Using cached pinned Linux build tree at $ATLANTIAN_KERNEL_COMMIT"
          else
            if [[ ! -d out/linux-src/.git ]]; then
              rm -rf out/linux-src
              git init out/linux-src
              git -C out/linux-src remote add origin https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git
            fi
            git -C out/linux-src remote set-url origin https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git
            git -C out/linux-src fetch --depth 1 origin "$ATLANTIAN_KERNEL_COMMIT"
            git -C out/linux-src checkout --detach --force FETCH_HEAD
            git -C out/linux-src clean -ffdqx
          fi
          test "$(git -C out/linux-src rev-parse HEAD)" = "$ATLANTIAN_KERNEL_COMMIT"

      - name: Build root filesystems
        id: rootfs
        env:
          DEBIAN_FRONTEND: noninteractive
          ATLANTIAN_DEBOOTSTRAP_CACHE: ${{ github.workspace }}/.cache/debootstrap
          ATLANTIAN_SKIP_PREFLIGHT: '1'
        run: sudo -E bash ./scripts/build-incremental.sh rootfs

      - name: Build Linux kernel
        id: kernel
        env:
          ATLANTIAN_SKIP_PREFLIGHT: '1'
        run: sudo -E bash ./scripts/build-incremental.sh kernel

      - name: Build release artifacts
        id: artifacts
        env:
          ATLANTIAN_SKIP_PREFLIGHT: '1'
        run: |
          set -euo pipefail
          sudo -E bash ./scripts/build-incremental.sh artifacts
          sudo chown -R "$USER:$USER" \
            artifacts .cache/debootstrap out/linux-src out/boot out/bootloader \
            out/u-boot-src out/u-boot-build out/u-boot-nand-build out/nand

      - name: Validate release artifacts
        id: artifact_check
        run: bash scripts/test-release-artifacts.sh artifacts/current

      - name: Validate SD image layout
        id: image_check
        run: sudo -E bash scripts/test-image-layout.sh "artifacts/current/$ATLANTIAN_IMAGE_NAME.img"

      - name: Validate NAND bundle
        id: nand_check
        run: bash scripts/test-nand-artifacts.sh out/nand/bundle "artifacts/current/$ATLANTIAN_IMAGE_NAME.img"

      - name: Test SD upgrade
        id: sd_upgrade
        env:
          GH_TOKEN: ${{ github.token }}
        run: sudo -E bash scripts/test-release-upgrade.sh artifacts/current

      - name: Test NAND rebase
        id: nand_rebase
        run: sudo -E bash scripts/test-nand-rebase.sh out/rootfs-nand

      - name: Verify source tree integrity
        id: source_integrity
        run: git diff --exit-code

      - name: Seal verified artifact
        id: seal
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > artifacts/current/VERIFIED-SOURCE-SHA
          printf '%s\n' "$ATLANTIAN_VERSION" > artifacts/current/VERIFIED-VERSION
          (cd artifacts/current && sha256sum -c SHA256SUMS)

      - name: Attest verified build
        id: attestation
        # v4.2.2
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-checksums: artifacts/current/SHA256SUMS

      - name: Upload verified artifact
        id: verified_artifact
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          if-no-files-found: error
          # The release-upgrade gate consumes a previous verified build without
          # touching public Release assets. Keep enough history for infrequent
          # release lines while staying within GitHub's normal retention limit.
          retention-days: 90
          overwrite: true
          path: |
            artifacts/current/*.img
            artifacts/current/*.img.xz
            artifacts/current/*.tar.zst
            artifacts/current/*.deb
            artifacts/current/*.packages.tsv
            artifacts/current/*.snapshot.txt
            artifacts/current/RELEASE-METADATA.json
            artifacts/current/SHA256SUMS
            artifacts/current/VERIFIED-SOURCE-SHA
            artifacts/current/VERIFIED-VERSION

      - name: Write build summary
        if: always()
        run: |
          {
            echo '## AtlANTian verified build'
            echo
            echo '| Stage | Outcome |'
            echo '|---|---|'
            echo '| Source contracts | ${{ steps.preflight.outcome }} |'
            echo '| Release inputs | ${{ steps.inputs.outcome }} |'
            echo '| Dependencies | ${{ steps.dependencies.outcome }} |'
            echo '| Debian package cache | ${{ steps.debootstrap_cache.outputs.cache-hit }} |'
            echo '| Linux build cache | ${{ steps.kernel_cache.outputs.cache-hit }} |'
            echo '| U-Boot source cache | ${{ steps.uboot_cache.outputs.cache-hit }} |'
            echo '| Root filesystems | ${{ steps.rootfs.outcome }} |'
            echo '| Linux kernel | ${{ steps.kernel.outcome }} |'
            echo '| Release artifacts | ${{ steps.artifacts.outcome }} |'
            echo '| Artifact validation | ${{ steps.artifact_check.outcome }} |'
            echo '| SD image layout | ${{ steps.image_check.outcome }} |'
            echo '| NAND bundle | ${{ steps.nand_check.outcome }} |'
            echo '| SD upgrade | ${{ steps.sd_upgrade.outcome }} |'
            echo '| NAND rebase | ${{ steps.nand_rebase.outcome }} |'
            echo '| Source tree integrity | ${{ steps.source_integrity.outcome }} |'
            echo '| Provenance attestation | ${{ steps.attestation.outcome }} |'
            echo '| Verified artifact upload | ${{ steps.verified_artifact.outcome }} |'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish release
    needs: [plan, build]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.publish_requested == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      ATLANTIAN_GITHUB_REPO: ${{ github.repository }}
      ATLANTIAN_PATCH_OVERRIDE: ${{ needs.plan.outputs.patch }}
      ATLANTIAN_PRERELEASE_OVERRIDE: ${{ needs.plan.outputs.prerelease }}
    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare release identity
        id: identity
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          export ATLANTIAN_SOURCE_REVISION
          ATLANTIAN_SOURCE_REVISION=$(git rev-parse --short=12 "$GITHUB_SHA")
          . config/release.env
          test "$ATLANTIAN_VERSION" = "$EXPECTED_VERSION"
          test "$ATLANTIAN_IMAGE_NAME" = "$ATLANTIAN_RELEASE_ID"
          {
            echo "ATLANTIAN_SOURCE_REVISION=$ATLANTIAN_SOURCE_REVISION"
            echo "ATLANTIAN_SOURCE_ID=$ATLANTIAN_SOURCE_ID"
            echo "ATLANTIAN_VERSION=$ATLANTIAN_VERSION"
            echo "ATLANTIAN_DEB_VERSION=$ATLANTIAN_DEB_VERSION"
            echo "ATLANTIAN_PRERELEASE=$ATLANTIAN_PRERELEASE"
            echo "ATLANTIAN_RELEASE_ID=$ATLANTIAN_RELEASE_ID"
            echo "ATLANTIAN_IMAGE_NAME=$ATLANTIAN_IMAGE_NAME"
            echo "RELEASE_TAG=v$ATLANTIAN_VERSION"
          } >> "$GITHUB_ENV"

      - name: Check publication eligibility
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          ALREADY_PUBLISHED: ${{ needs.plan.outputs.already_published }}
        run: |
          set -euo pipefail

          tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha 2>/dev/null) || tag_commit=""

          if [[ "$ALREADY_PUBLISHED" = true ]]; then
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
              && [[ "$tag_commit" = "$GITHUB_SHA" ]]; then
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              echo "Release $RELEASE_TAG is already complete for this exact source; idempotent no-op." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Previously detected release $RELEASE_TAG disappeared or moved; refusing to publish without a verified artifact." >&2
            exit 1
          fi

          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'This build was superseded by a newer main commit; publication is skipped.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$tag_commit" = "$GITHUB_SHA" ]]; then
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              echo "Release $RELEASE_TAG appeared concurrently for this exact source; idempotent no-op." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Release $RELEASE_TAG belongs to another source revision (${tag_commit:-unknown}); refusing to overwrite it." >&2
            exit 1
          fi

          if [[ -n "$tag_commit" && "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "Tag $RELEASE_TAG already points to $tag_commit; automatic publication will never retarget an existing tag." >&2
            exit 1
          fi

          echo 'publish=true' >> "$GITHUB_OUTPUT"
          echo 'Current main revision is eligible for publication.' >> "$GITHUB_STEP_SUMMARY"

      - name: Download verified artifact
        id: artifact_source
        if: steps.publication.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN_ID: ${{ needs.plan.outputs.reuse_run_id }}
          ARTIFACT_NAME: ${{ needs.plan.outputs.artifact_name }}
        run: |
          set -euo pipefail
          source_run=${REUSE_RUN_ID:-$GITHUB_RUN_ID}
          rm -rf artifacts/current
          mkdir -p artifacts/current
          gh run download "$source_run" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir artifacts/current
          echo "run_id=$source_run" >> "$GITHUB_OUTPUT"

      - name: Verify publication payload
        if: steps.publication.outputs.publish == 'true'
        run: |
          set -euo pipefail
          test "$(cat artifacts/current/VERIFIED-SOURCE-SHA)" = "$GITHUB_SHA"
          test "$(cat artifacts/current/VERIFIED-VERSION)" = "$ATLANTIAN_VERSION"
          test "$RELEASE_TAG" = "v$ATLANTIAN_VERSION"
          test -s "artifacts/current/$ATLANTIAN_IMAGE_NAME.img"
          test -s "artifacts/current/$ATLANTIAN_IMAGE_NAME.img.xz"
          test -s "artifacts/current/atlantian-nand-$ATLANTIAN_VERSION.tar.zst"
          test "$(find artifacts/current -maxdepth 1 -name '*.img' -type f | wc -l)" -eq 1
          test "$(find artifacts/current -maxdepth 1 -name '*.img.xz' -type f | wc -l)" -eq 1
          test "$(find artifacts/current -maxdepth 1 -name '*.deb' -type f | wc -l)" -eq 3
          xz -t "artifacts/current/$ATLANTIAN_IMAGE_NAME.img.xz"
          raw_sha=$(sha256sum "artifacts/current/$ATLANTIAN_IMAGE_NAME.img" | awk '{print $1}')
          decoded_sha=$(xz -dc "artifacts/current/$ATLANTIAN_IMAGE_NAME.img.xz" | sha256sum | awk '{print $1}')
          test "$decoded_sha" = "$raw_sha"
          (cd artifacts/current && sha256sum -c SHA256SUMS)

      - name: Generate release notes
        if: steps.publication.outputs.publish == 'true'
        run: bash scripts/generate-release-notes.sh "$RELEASE_TAG" "$GITHUB_SHA"

      - name: Prepare aggregate update marker
        if: steps.publication.outputs.publish == 'true'
        run: |
          set -euo pipefail
          python3 - "$ATLANTIAN_VERSION" > artifacts/current/atlantian-update.json <<'PY'
          import json
          import sys

          json.dump({
              "schema_version": 1,
              "kind": "atlantian-system-update",
              "release": sys.argv[1],
          }, sys.stdout, separators=(",", ":"))
          sys.stdout.write("\n")
          PY
          python3 - "$ATLANTIAN_VERSION" <<'PY'
          import json
          import sys

          with open("artifacts/current/atlantian-update.json", encoding="utf-8") as stream:
              marker = json.load(stream)
          assert marker == {
              "schema_version": 1,
              "kind": "atlantian-system-update",
              "release": sys.argv[1],
          }
          PY

      - name: Publish GitHub release
        if: steps.publication.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_assets=(
            "artifacts/current/$ATLANTIAN_IMAGE_NAME.img.xz"
            artifacts/current/atlantian-kernel_*.deb
            "artifacts/current/atlantian-nand-$ATLANTIAN_VERSION.tar.zst"
            artifacts/current/atlantian-platform_*.deb
            artifacts/current/atlantian-release_*.deb
            artifacts/current/atlantian-update.json
            artifacts/current/RELEASE-METADATA.json
            artifacts/current/SHA256SUMS
          )

          tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha 2>/dev/null) || tag_commit=""

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$tag_commit" = "$GITHUB_SHA" ]]; then
              echo "Release $RELEASE_TAG appeared concurrently for this source; nothing remains to publish."
              exit 0
            fi
            echo "Release $RELEASE_TAG appeared for another source revision; refusing to overwrite it." >&2
            exit 1
          fi

          if [[ -n "$tag_commit" && "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "Tag $RELEASE_TAG moved to $tag_commit; refusing to retarget it." >&2
            exit 1
          fi

          prerelease=()
          if [[ -n "$ATLANTIAN_PRERELEASE" ]]; then
            prerelease+=(--prerelease)
          fi

          if ! gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AtlANTian GNU/Linux $ATLANTIAN_VERSION" \
            --notes-file release-notes.md \
            "${prerelease[@]}" \
            "${release_assets[@]}"; then
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha 2>/dev/null) || tag_commit=""
              if [[ "$tag_commit" = "$GITHUB_SHA" ]]; then
                echo "Release $RELEASE_TAG appeared concurrently for this source; treating publication as successful."
                exit 0
              fi
            fi
            exit 1
          fi

      - name: Write publication summary
        if: always()
        run: |
          {
            echo '## AtlANTian publication'
            echo
            echo '| Item | Value |'
            echo '|---|---|'
            echo '| Version | ${{ needs.plan.outputs.version }} |'
            echo '| Build job | ${{ needs.build.result }} |'
            echo '| Reused workflow run | ${{ needs.plan.outputs.reuse_run_id || 'none' }} |'
            echo '| Artifact source run | ${{ steps.artifact_source.outputs.run_id || 'none' }} |'
            echo '| Publication eligible | ${{ steps.publication.outputs.publish }} |'
          } >> "$GITHUB_STEP_SUMMARY"
