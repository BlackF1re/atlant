name: Debian Base Watch

on:
  schedule:
    - cron: '17 6 * * *'
      timezone: 'Asia/Tomsk'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # Exercise protected-maintenance plumbing immediately after it changes.
      - '.github/workflows/debian-watch.yml'
      - '.github/workflows/ci.yml'
      - '.github/scripts/merge-protected-main.sh'

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: atlantian-debian-watch
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh Debian base
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Refresh Debian snapshot
        id: debian
        run: bash scripts/refresh-debian-base.sh

      - name: Validate snapshot
        if: steps.debian.outputs.changed == 'true'
        run: bash scripts/validate-release-inputs.sh

      - name: Report Debian major availability
        if: steps.debian.outputs.major_available == 'true'
        run: |
          {
            echo '## Debian major release available'
            echo
            echo 'Debian ${{ steps.debian.outputs.candidate_major }} (${{ steps.debian.outputs.candidate_codename }}) is available.'
            echo 'AtlANTian will remain on the configured Debian generation until an explicit release-line transition is made.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit snapshot through protected main
        id: snapshot_merge
        if: steps.debian.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          . config/release.env
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add debian-release.sha256 debian-updates-release.sha256 debian-security-release.sha256 \
            config/debian-snapshot.env
          title="chore(debian): refresh ${DEBIAN_CODENAME} snapshot"
          git commit -m "$title"
          base_sha=$GITHUB_SHA
          head_sha=$(git rev-parse HEAD)
          branch="maintenance/debian-snapshot-${{ steps.debian.outputs.snapshot }}-${GITHUB_RUN_ID}"
          merge_sha=$(bash .github/scripts/merge-protected-main.sh "$branch" "$title" "$base_sha" "$head_sha")
          [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "protected merge helper returned invalid SHA: $merge_sha" >&2
            exit 1
          }
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"

      - name: Dispatch verified release build
        if: steps.debian.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: ${{ steps.snapshot_merge.outputs.merge_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_MAIN" =~ ^[0-9a-f]{40}$ ]]
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          [[ "$main_sha" == "$EXPECTED_MAIN" ]] || {
            echo "protected main moved after snapshot merge: expected $EXPECTED_MAIN, got $main_sha" >&2
            exit 1
          }
          # GITHUB_TOKEN merges do not recursively trigger push workflows.
          # Dispatch the exact validated main revision explicitly; build-release
          # recognizes this origin and bypasses the normal five-commit batch.
          gh workflow run build-release.yml --ref main -f publish=false -f origin=debian-watch

      # Self-heal the narrow failure window between a successful protected
      # Snapshot merge and the explicit Build & Release dispatch. If the frozen
      # Snapshot files in current main differ from the latest published tag, the
      # factory baseline has not yet been represented by a release.
      - name: Recover undispatched snapshot build
        id: recovery
        if: steps.debian.outputs.changed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo 'dispatched=false' >> "$GITHUB_OUTPUT"
          latest_tag=$(git tag --list 'v*' --sort=-version:refname | head -n1)
          [[ -n "$latest_tag" ]] || exit 0
          if git diff --quiet "$latest_tag" -- \
            config/debian-snapshot.env \
            debian-release.sha256 debian-updates-release.sha256 debian-security-release.sha256; then
            exit 0
          fi

          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          [[ "$main_sha" == "$GITHUB_SHA" ]] || {
            echo "main moved before snapshot-build recovery: expected $GITHUB_SHA, got $main_sha" >&2
            exit 1
          }
          echo "Current frozen Debian Snapshot differs from $latest_tag; recovering the missing release dispatch."
          gh workflow run build-release.yml --ref main -f publish=false -f origin=debian-watch
          echo 'dispatched=true' >> "$GITHUB_OUTPUT"

      # GitHub can disable scheduled workflows after prolonged public-repository
      # inactivity. Refresh repository activity only when the source tree itself
      # has been quiet for 45 days; use the same protected-main validation path.
      - name: Keep schedule active
        if: steps.debian.outputs.changed != 'true' && steps.recovery.outputs.dispatched != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          last=$(git log -1 --format=%ct)
          (( now - last >= 45 * 86400 )) || exit 0
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          title='chore: keep Debian watcher active'
          git commit --allow-empty -m "$title"
          base_sha=$GITHUB_SHA
          head_sha=$(git rev-parse HEAD)
          branch="maintenance/debian-heartbeat-${GITHUB_RUN_ID}"
          bash .github/scripts/merge-protected-main.sh "$branch" "$title" "$base_sha" "$head_sha" >/dev/null
