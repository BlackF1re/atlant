name: Download Metrics

on:
  release:
    types: [published]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlantian-image-download-metric
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh public download totals
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Sum public download metrics
        id: metric
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          releases=$(mktemp)
          trap 'rm -f "$releases"' EXIT
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" >"$releases"
          image_downloads=$(jq '[.[][] | .assets[] | select(.name | test("^atlantian-[^/]+\\.img\\.xz$")) | .download_count] | add // 0' "$releases")
          system_updates=$(jq '[.[][] | .assets[] | select(.name == "atlantian-update.json") | .download_count] | add // 0' "$releases")
          printf 'image_downloads=%s\n' "$image_downloads" >>"$GITHUB_OUTPUT"
          printf 'system_updates=%s\n' "$system_updates" >>"$GITHUB_OUTPUT"

      - name: Create Pages payload
        env:
          IMAGE_DOWNLOADS: ${{ steps.metric.outputs.image_downloads }}
          SYSTEM_UPDATES: ${{ steps.metric.outputs.system_updates }}
        run: |
          set -euo pipefail
          mkdir -p site
          jq -n \
            --argjson image_downloads "$IMAGE_DOWNLOADS" \
            --argjson system_updates "$SYSTEM_UPDATES" \
            --arg updated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion: 1, imageDownloads: $image_downloads, systemUpdates: $system_updates, updatedAt: $updated_at, scopes: {imageDownloads: "atlantian-<release>.img.xz assets across all GitHub Releases", systemUpdates: "atlantian-update.json assets across all GitHub Releases"}}' \
            >site/image-downloads.json

      - name: Configure Pages
        # v5.0.0
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload Pages artifact
        # v3.0.1
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site

      - name: Deploy Pages artifact
        id: deployment
        # v4.0.5
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
