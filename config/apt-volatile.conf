// AtlANTian keeps APT's disposable state off persistent storage.
// /run/apt is a dedicated volatile tmpfs shared by SD and NAND editions.
Dir::State::Lists "/run/apt/lists/";
Dir::Cache::archives "/run/apt/archives/";

// Rebuild these in-memory structures on demand instead of storing cache files.
Dir::Cache::pkgcache "";
Dir::Cache::srcpkgcache "";

// Keep repository metadata compact and omit data unused by normal package work.
Acquire::Languages "none";
Acquire::GzipIndexes "true";
Acquire::CompressionTypes::Order { "gz"; };
Acquire::IndexTargets::deb::Contents-deb::DefaultEnabled "false";
Acquire::IndexTargets::deb::Contents-udeb::DefaultEnabled "false";
Acquire::IndexTargets::deb-src::Contents-dsc::DefaultEnabled "false";
