# Published release location. GitHub Actions stamps the repository in which the
# build actually runs into AtlANTian release metadata. Environment variables
# still take precedence for mirrors, forks and one-off testing.
if [ -z "${ATLANTIAN_GITHUB_REPO:-}" ]; then
  # Installed images carry their publication source explicitly.
  if [ -s /usr/lib/atlantian/os-release ]; then
    ATLANTIAN_GITHUB_REPO=$(sed -n 's/^ATLANTIAN_RELEASE_REPOSITORY="\{0,1\}\([^"[:space:]]*\)"\{0,1\}$/\1/p' /usr/lib/atlantian/os-release | head -n1)
  fi
  if [ -z "${ATLANTIAN_GITHUB_REPO:-}" ] && [ -s /usr/lib/atlantian/release-repo ]; then
    ATLANTIAN_GITHUB_REPO=$(cat /usr/lib/atlantian/release-repo)
  fi

  # During GitHub Actions the current repository is authoritative. This is what
  # makes a source archive committed into a brand-new repository self-contained.
  if [ -z "${ATLANTIAN_GITHUB_REPO:-}" ] && [ -n "${GITHUB_REPOSITORY:-}" ]; then
    ATLANTIAN_GITHUB_REPO=$GITHUB_REPOSITORY
  fi

  # Local builds after an archive migration can infer the same identity from the
  # newly-created repository's origin, without requiring config edits.
  if [ -z "${ATLANTIAN_GITHUB_REPO:-}" ] && command -v git >/dev/null 2>&1; then
    ATLANTIAN_GIT_ORIGIN=$(git config --get remote.origin.url 2>/dev/null || true)
    ATLANTIAN_GIT_REPO=
    case "$ATLANTIAN_GIT_ORIGIN" in
      https://github.com/*)
        ATLANTIAN_GIT_REPO=${ATLANTIAN_GIT_ORIGIN#https://github.com/}
        ;;
      git@github.com:*)
        ATLANTIAN_GIT_REPO=${ATLANTIAN_GIT_ORIGIN#git@github.com:}
        ;;
      ssh://git@github.com/*)
        ATLANTIAN_GIT_REPO=${ATLANTIAN_GIT_ORIGIN#ssh://git@github.com/}
        ;;
    esac
    ATLANTIAN_GIT_REPO=${ATLANTIAN_GIT_REPO%.git}
    case "$ATLANTIAN_GIT_REPO" in
      */*) ATLANTIAN_GITHUB_REPO=$ATLANTIAN_GIT_REPO ;;
    esac
    unset ATLANTIAN_GIT_ORIGIN ATLANTIAN_GIT_REPO
  fi

  # Canonical fallback is retained only for source trees that have neither build
  # metadata, GitHub context nor a recognizable GitHub origin.
  ATLANTIAN_GITHUB_REPO=${ATLANTIAN_GITHUB_REPO:-BlackF1re/atlantian}
fi
ATLANTIAN_RELEASE_API=${ATLANTIAN_RELEASE_API:-https://api.github.com}
